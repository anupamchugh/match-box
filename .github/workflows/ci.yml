name: CI

on:
  push:
  pull_request:

jobs:
  swift-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build CLI
        run: swift build --product match-inbox
      - name: Build macOS app
        run: swift build --product MatchInboxApp
